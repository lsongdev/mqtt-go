name: CI

on:
  push:
    branches: ["refactor/protocol-runtime"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            gofmt -d $files
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race
        run: go test -race ./...

  interoperability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent MQTT implementations
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
          python -m pip install -r mqtt/testdata/requirements-interop.txt
          mosquitto -h
      - name: Interoperability with race detector
        env:
          INTEROP_PYTHON: python
        run: make interop
